
name: TaskFlow CI/CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Package application
        run: |
          mkdir -p dist/database
          cp -r src public package.json package-lock.json dist/
          cp database/.gitkeep dist/database/
          cd dist
          zip -r ../taskflow.zip .

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-build
          path: taskflow.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload build to S3
        run: |
          aws s3 cp taskflow.zip \
            s3://${{ secrets.S3_BUCKET }}/builds/taskflow-${GITHUB_SHA}.zip

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            /var/www/taskflow/deploy.sh ${{ github.sha }}
